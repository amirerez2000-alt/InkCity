{% extends 'books/base.html' %}
{% load static %}
{% block title %}פרסם ספר חדש{% endblock %}
{% block content %}
<div class="container">
    <h2>פרסום ספר חדש בארת 📚</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">פרסם ספר</button>
    </form>
    <p><a href="{% url 'home' %}">ביטול וחזרה</a></p>
</div>
{% endblock %}
