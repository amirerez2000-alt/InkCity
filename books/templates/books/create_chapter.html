{% extends 'books/base.html' %}
{% load static %}
{% block title %}הוספת פרק ל-{{ book.title }}{% endblock %}
{% block content %}
<div class="container">
    <h2>הוספת פרק חדש ל"{{ book.title }}"</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">פרסם פרק</button>
    </form>
    <p><a href="{% url 'book_detail' book.id %}">ביטול וחזרה לספר</a></p>
</div>
{% endblock %}
