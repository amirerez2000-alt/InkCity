{% extends 'books/base.html' %}

{% block title %}פתח דיון חדש - {{ category.name }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h2>פתיחת דיון חדש בקטגוריית "{{ category.name }}"</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px 20px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer;">פרסם דיון</button>
    </form>
    <p><a href="{% url 'category_detail' category.id %}">ביטול</a></p>
</div>
{% endblock %}
