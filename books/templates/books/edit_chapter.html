{% extends 'books/base.html' %}

{% block title %}עריכת פרק {{ chapter.chapter_number }}: {{ chapter.title }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 700px;">
    <a href="{% url 'chapter_detail' chapter.book.id chapter.chapter_number %}">← חזרה לפרק</a>
    <h1 style="margin-top: 15px;">✏️ עריכת פרק {{ chapter.chapter_number }}: {{ chapter.title }}</h1>

    <form method="post" style="margin-top: 20px;">
        {% csrf_token %}
        {{ form.as_p }}

        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button type="submit" class="btn-primary">שמור שינויים</button>
            <a href="{% url 'chapter_detail' chapter.book.id chapter.chapter_number %}" style="padding: 10px 20px; background: var(--nav-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; text-decoration: none;">ביטול</a>
        </div>
    </form>
</div>
{% endblock %}
