{% extends 'books/base.html' %}
{% load static %}
{% block title %}התחברות ל-InkCity{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align:center;">התחברות</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">היכנס</button>
    </form>
    <p>עוד אין לך משתמש? <a href="{% url 'register' %}">הרשם כאן</a></p>
    <p><a href="{% url 'home' %}">חזרה לעמוד הבית</a></p>
</div>
{% endblock %}
